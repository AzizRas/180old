<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120" role="img" aria-label="180 kun">
  <title>180 kun</title>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5A1F"/>
      <stop offset="1" stop-color="#FFB020"/>
    </linearGradient>
  </defs>

  <!-- Знак: разорванное кольцо и точка, которая возвращается на место.
       Разрыв — это срыв. Точка — возвращение. -->
  <g transform="translate(60,60)">
    <circle r="42" fill="none" stroke="#243049" stroke-width="10"/>
    <path d="M 0 -42 A 42 42 0 1 1 -29.7 29.7"
          fill="none" stroke="url(#g1)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-29.7" cy="29.7" r="9" fill="#FF5A1F"/>
    <circle cx="-29.7" cy="29.7" r="17" fill="none" stroke="#FF5A1F" stroke-width="2.5" opacity=".35"/>
  </g>

  <!-- Слово -->
  <text x="126" y="72"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="52" font-weight="800" letter-spacing="-1" fill="#E9EEF8">180</text>
  <text x="228" y="72"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="52" font-weight="300" letter-spacing="2" fill="#FF5A1F">kun</text>
  <text x="129" y="94"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="12.5" font-weight="600" letter-spacing="3.6" fill="#5E6B87">ВЕРНУТЬСЯ ВАЖНЕЕ</text>
</svg>
